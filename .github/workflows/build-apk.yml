name: Build & Release Android APK / AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$KEYSTORE_BASE64" ]; then MISSING_SECRETS="$MISSING_SECRETS KEYSTORE_BASE64"; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then MISSING_SECRETS="$MISSING_SECRETS KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then MISSING_SECRETS="$MISSING_SECRETS KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then MISSING_SECRETS="$MISSING_SECRETS KEY_PASSWORD"; fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Missing required GitHub Secrets for Release signing:$MISSING_SECRETS"
            echo "Please configure the missing secrets in: Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Prepare Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore/release.jks
          chmod 600 /tmp/keystore/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: /tmp/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build Release AAB (Android App Bundle)
        env:
          KEYSTORE_FILE: /tmp/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ahl-al-Quran-Release-APK
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ahl-al-Quran-Release-AAB
          path: app/build/outputs/bundle/release/app-release*.aab
          if-no-files-found: error

      - name: Clean up Keystore File
        if: always()
        run: |
          rm -rf /tmp/keystore
